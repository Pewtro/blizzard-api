name: CI
permissions:
  contents: read

on:
  schedule:
    - cron: '0 12 * * *'
  pull_request:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # The node version to release with, generally the latest LTS
  release_node: 24.x

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Test against multiple node versions
        # Any currently maintained version, e.g. whether they are current, active or maintenance should be included
        node: [22.x, 24.x, 26.x]
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # https://github.com/pnpm/action-setup/releases/tag/v6.1.1
        with:
          version: 12.18.0

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node }}-

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install

      - name: Turbo build
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build
        if: matrix.node == env.release_node

      - name: Lint, Format, and Typecheck
        run: pnpm lint:ci

      - name: Test packages (unit)
        run: pnpm test:unit

      # Only run integration tests on the release node version. Integration tests call the
      # live Blizzard API, so running them once cuts request volume against the rate limit.
      - name: Test packages (integration)
        run: pnpm test:integration
        if: matrix.node == env.release_node
        env:
          BLIZZARD_BNET_ACCOUNT_ID: ${{ secrets.BLIZZARD_BNET_ACCOUNT_ID }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}

  release:
    name: Release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'pewtro/blizzard-api' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # https://github.com/pnpm/action-setup/releases/tag/v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js ${{ env.release_node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.release_node }}
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install

      - name: Turbo build
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # https://github.com/changesets/action/releases/tag/v2.1.2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
