packages:
  - 'packages/*'

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

saveExact: true

# 3 day cooldown
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@putstack/eslint-config-typescript'
  - '@putstack/oxfmt-config'

# deduplicates compatible dependency versions during installation
autoDedupe: true
lockfile:
  includeResolutionSettings: true
# saves available @types/* packages in devDependencies alongside registry dependencies
saveTypes: true
